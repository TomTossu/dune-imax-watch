name: Scheduled test (temporary)

# Temporary probe. Targets a movie that is currently in IMAX (Avengers Endgame)
# so we can watch the bot detect it and send the email. Remove when done.

on:
  schedule:
    - cron: "*/5 * * * *"
  push:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Look for a currently-playing movie
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          TARGET_MOVIE: "avengers endgame"
        run: python check_dune.py

      - name: Persist test state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore: update test state [skip ci]"
            git push
          else
            echo "No state change."
          fi
