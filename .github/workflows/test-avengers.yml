name: Test Avengers (temporary)

# Temporary test: targets a movie that is currently in IMAX (Avengers Endgame)
# with ALWAYS_NOTIFY so every run emails. Triggered by the same cron-job.org
# dispatch as production. Delete when no longer needed.

on:
  push:
  repository_dispatch:
    types: [check-dune]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Look for a currently-playing movie
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          TARGET_MOVIE: "avengers endgame"
          ALWAYS_NOTIFY: "1"
        run: python check_dune.py
