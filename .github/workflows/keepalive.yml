name: Keepalive

# GitHub disables scheduled workflows after 60 days of repository inactivity.
# Dune may not appear for months, so this commits a timestamp monthly to keep
# the schedule alive. It must stay well under the 60-day window.

on:
  schedule:
    - cron: "0 12 1 * *" # 12:00 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Commit timestamp
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git add .keepalive
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "chore: keepalive [skip ci]"
            git push
          fi
